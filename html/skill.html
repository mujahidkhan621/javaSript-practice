<body>
    <section class="home" id="Home">
        <nav>
            <div class="nav_logo">
                <h1>Mujahid Khan | <span class="forIngradients ">Webdeveloper</span></h1>
            </div>

            <div class="nav_menu js_menu">
                <a href="../html/Index.html" class="nav_link js_link">Home</a>
                <!-- <a href="#" class="nav_link js_link">About Me</a> -->
                <a href="#" class="nav_link js_link">My Skills</a>
                <a href="../html/projects.html" class="nav_link js_link">My Projects</a>
                <a href="../html/contacte#" class="nav_link js_link">Contacte Me</a>
            </div>
            <!-- for mobile menu -->
            <div class="menu-toggle"><i class="fa-solid fa-bars "></i></div>
        </nav>
    </section>
    <!-- skill section  -->
       <section class="skill">
        <!-- bar for skill  -->
        <div class="banner"><h1 class="forIngradients">About My Skills</h1></div>
        <!-- skill div -->
        <div class="skill--div">
            <div class="language">
                <div class="language--sect">
                    <h4>HTML</h4>
                    <div class="icon"><i class="fa-brands fa-html5"></i>
                        <div class="progress">
                            <div class="bar-html js-animate">90%</div>
                        </div>
                    </div>
                </div>
                <div class="language--sect">
                    <h4>CSS</h4>
                    <div class="icon"><i class="fa-brands fa-css3-alt"></i>
                        <div class="progress">
                            <div class="bar-css js-animate">75%</div>
                        </div>
                    </div>

                </div>
                <div class="language--sect">
                    <h4>JavaScript</h4>
                    <div class="icon"> <i class="fa-brands fa-js"></i>
                        <div class="progress">
                            <div class="bar-js js-animate">65%</div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- show slidings in display using javaScript  -->
            <div class="display">
                <div class="bubble-nav">
                    <div class="bubbles checked"></div>
                    <div class="bubbles"></div>
                    <div class="bubbles"></div>
                </div>

                <div class="card-container">
                    <div class="content-panel red active" id="panel1">This is Panel 1</div>
                    <div class="content-panel yellow" id="panel2">This is Panel 2</div>
                    <div class="content-panel green" id="panel3">This is Panel 3</div>
                </div>
            </div>

        </div>
        </div>
