<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mujahid Khan || webdeveloper</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="../pics/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../stylsheet/Index.css">
    <link rel="stylesheet" href="../stylsheet/about.css">
    <link rel="stylesheet" href="../stylsheet/skill.css">
    <link rel="stylesheet" href="../stylsheet/slider.css">
    <link rel="stylesheet" href="../stylsheet/banner.css">
    <link rel="stylesheet" href="../stylsheet/contacte.css">
</head>

<body>
    
    <!-- contact page  -->
    <section class="contact-container">

        <div class="outer_div">
            <div class="banner">
                <h1 class="forIngradients">Get In Touch</h1>
            </div>

            <div class="contact-form">
                <form action="contact" method="post">
                    <label for="c_name">Name</label>
                    <input type="text" name="c_name" id="c_name" placeholder="Your name" required>

                    <label for="c_tel_no">Phone Number</label>
                    <input type="tel" name="c_tel_no" id="c_tel_no" placeholder="03434706944" required>

                    <label for="c_email">Your Email</label>
                    <input type="email" name="c_email" id="c_email" placeholder="your@email.com" required>

                    <button type="submit" id="submit_btn">Submit</button>
                </form>
            </div>
            <div class="social-media">
                <a href="https://facebook.com/yourusername" target="_blank" aria-label="Facebook"><i
                        class="fab fa-facebook"></i></a>
                <a href="https://instagram.com/yourusername" target="_blank" aria-label="Instagram"><i
                        class="fab fa-instagram"></i></a>
                <a href="https://github.com/yourusername" target="_blank" aria-label="GitHub"><i
                        class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/yourusername" target="_blank" aria-label="LinkedIn"><i
                        class="fab fa-linkedin"></i></a>
                <a href="mailto:you@example.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>

        </div>
    </section>


    
    <script src="../Scripts/changIcon.js"></script>
    <script src="../Scripts/script.js"></script>
</body>

</html>
